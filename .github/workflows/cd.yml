# Simulated pipeline: nothing is deployed. Real releases follow docs/RELEASE.txt.
# Approvals come from required reviewers on each GitHub environment. An environment
# without them runs straight through, so set them up in the repository settings.
#
# A version tag starts this pipeline and every stage deploys that tag, so a merge on
# its own deploys nothing. The merge-and-tag skill pushes the tag straight after the
# merge. To deploy a tag again, run this workflow from that tag.
name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check this is a described version on master
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run CD from a version tag, not a branch."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master."
            exit 1
          fi
          if [ "$(make -s version)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the version in the code."
            exit 1
          fi
          # Checkout can turn an annotated tag into a plain one, so fetch the real tag.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes"
          bash .github/scripts/check-tag-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  dev:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy the tag to dev
        run: |
          echo "Simulating deploy of $GITHUB_REF_NAME to dev"
          sleep 30

  test:
    needs: dev
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy the tag to test
        run: |
          echo "Simulating deploy of $GITHUB_REF_NAME to test"
          sleep 30

  qa:
    needs: test
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Deploy the tag to qa
        run: |
          echo "Simulating deploy of $GITHUB_REF_NAME to qa"
          sleep 30

  prd:
    needs: qa
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Deploy the tag to prd
        run: |
          echo "Simulating deploy of $GITHUB_REF_NAME to prd"
          sleep 30
