name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the version is master plus 0.1
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          bash .github/scripts/check-version.sh FETCH_HEAD
      - name: Build and run all tests
        run: make test
